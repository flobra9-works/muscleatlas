<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e1a">
  <meta name="description" content="MuscleAtlas — find exercises by muscle, build workouts and train with timer, heart rate and music.">
  <title>MuscleAtlas</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>

  <header class="app-header">
    <div class="logo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b2c"/><stop offset="1" stop-color="#ff2d78"/></linearGradient></defs><path fill="url(#logoGrad)" d="M20.6 8.6 22 7.2 20.8 6l1-1L19.9 3l-1 1L17.7 2.8 16.3 4.2l-1.2-1.1L13 5.2 18.8 11l2.1-2.1-.3-.3zM3.4 15.4 2 16.8 3.2 18l-1 1L4.1 21l1-1 1.2 1.2 1.4-1.4 1.2 1.1L11 18.8 5.2 13l-2.1 2.1.3.3z"/><rect x="9.2" y="10" width="5.6" height="4" rx="1" transform="rotate(45 12 12)" fill="url(#logoGrad)"/></svg>
      <span class="wortmarke">Muscle<b>Atlas</b></span>
    </div>
    <div class="header-aktionen">
      <button id="einstellungenBtn" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.5-2.4 1a7.7 7.7 0 0 0-2.6-1.5L14 2.5h-4L9.6 5a7.7 7.7 0 0 0-2.6 1.5l-2.4-1-2 3.5 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.5 2.4-1a7.7 7.7 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.7 7.7 0 0 0 2.6-1.5l2.4 1 2-3.5-2-1.5z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- ============ TAB 1: MUSCLES ============ -->
    <section id="tab-muskeln" class="tab-panel aktiv">
      <div class="karten-kopf">
        <div class="segmente" id="auswahlmodusSegmente">
          <button data-modus="karte" class="aktiv">Body map</button>
          <button data-modus="liste">List</button>
        </div>
        <span class="hinweis-klein" id="kartenHinweis">Tap a muscle group</span>
      </div>

      <div id="koerperkarte" class="koerperkarte"></div>

      <div id="gruppenListe" class="gruppen-liste versteckt"></div>

      <div id="auswahlBereich" class="versteckt">
        <div class="abschnitt-titel" id="auswahlTitel"></div>
        <div class="chip-zeile" id="regionChips"></div>
        <div class="chip-zeile" id="filterChips"></div>
        <div id="uebungsListe"></div>
      </div>
    </section>

    <!-- ============ TAB 2: WORKOUTS ============ -->
    <section id="tab-workouts" class="tab-panel">
      <div id="workoutsInhalt"></div>
    </section>

    <!-- ============ TAB 3: TRAINING ============ -->
    <section id="tab-training" class="tab-panel">
      <div id="trainingInhalt"></div>
    </section>

    <!-- ============ TAB 4: HISTORY ============ -->
    <section id="tab-historie" class="tab-panel">
      <div id="historieInhalt"></div>
    </section>
  </main>

  <nav class="tab-bar">
    <button data-tab="muskeln" class="aktiv" aria-label="Muscles and exercises">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.6"/><path d="M12 8.5v6M12 14.5l-3.5 6M12 14.5l3.5 6M6 10.5c2 1.4 10 1.4 12 0"/></svg>
      Muscles
    </button>
    <button data-tab="workouts" aria-label="My workouts">
      <svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4.5"/></svg>
      Workouts
    </button>
    <button data-tab="training" aria-label="Start training">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 13V9M9.5 2.5h5"/></svg>
      Training
    </button>
    <button data-tab="historie" aria-label="Training history">
      <svg viewBox="0 0 24 24"><path d="M4 20V9M9.3 20V4M14.7 20v-7M20 20V6"/></svg>
      History
    </button>
  </nav>

  <!-- ============ Onboarding ============ -->
  <div id="onboarding" class="overlay versteckt" role="dialog" aria-modal="true">
    <div class="overlay-inhalt onboarding-inhalt">
      <h1>Welcome to Muscle<span class="akzent-text">Atlas</span> 💪</h1>
      <p>One quick thing: calorie estimates use a different formula per sex.
         You can change this any time in Settings&nbsp;⚙.</p>
      <div class="geschlecht-wahl schlicht">
        <button id="wahlMann">
          <span class="wahl-zeichen">♂</span>
          <span class="wahl-label">Male</span>
        </button>
        <button id="wahlFrau">
          <span class="wahl-zeichen">♀</span>
          <span class="wahl-label">Female</span>
        </button>
      </div>
      <p class="hinweis-klein" style="margin-top:14px;">The anatomy illustration is male —
         it is the only openly licensed 3D model available.</p>
    </div>
  </div>

  <!-- ============ Exercise detail ============ -->
  <div id="uebungDetail" class="overlay versteckt" role="dialog" aria-modal="true">
    <div class="overlay-inhalt" id="uebungDetailInhalt"></div>
  </div>

  <!-- ============ Settings ============ -->
  <div id="einstellungen" class="overlay versteckt" role="dialog" aria-modal="true">
    <div class="overlay-inhalt" id="einstellungenInhalt"></div>
  </div>

  <!-- ============ Workout picker (＋ add to workout) ============ -->
  <div id="workoutWahl" class="overlay versteckt" role="dialog" aria-modal="true">
    <div class="overlay-inhalt" id="workoutWahlInhalt"></div>
  </div>

  <!-- ============ Session detail (history) ============ -->
  <div id="sessionDetail" class="overlay versteckt" role="dialog" aria-modal="true">
    <div class="overlay-inhalt" id="sessionDetailInhalt"></div>
  </div>

  <!-- ============ Exercise picker (in the workout editor) ============ -->
  <div id="uebungsPicker" class="overlay versteckt" role="dialog" aria-modal="true">
    <div class="overlay-inhalt" id="uebungsPickerInhalt"></div>
  </div>

  <div id="toast" role="status"></div>

  <script src="data/muscles.js?v=10"></script>
  <script src="data/bodyregions.js?v=10"></script>
  <script src="data/exercises.js?v=10"></script>
  <script src="js/state.js?v=10"></script>
  <script src="js/heartrate.js?v=10"></script>
  <script src="js/bodymap.js?v=10"></script>
  <script src="js/exercises.js?v=10"></script>
  <script src="js/workouts.js?v=10"></script>
  <script src="js/training.js?v=10"></script>
  <script src="js/history.js?v=10"></script>
  <script src="js/app.js?v=10"></script>
</body>
</html>
